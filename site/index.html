<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Generator</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #000;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main {
        max-width: 36rem;
        border: 4px solid #000;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
      }
      p { line-height: 1.5; margin-bottom: 0.75rem; }
      .accent { background: #ffe600; display: inline-block; padding: 0 0.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recipe <span class="accent">Generator</span></h1>
      <p>AI-powered recipes with a brutalist Framer-style UI — coming soon.</p>
      <p>This site deploys automatically when changes land on <code>main</code>.</p>
    </main>
  </body>
</html>
