name: pages

# Push to main runs the mechanical check, builds the site, and deploys to
# GitHub Pages. Agents commit and push to main; CI owns production deploy.
#
# The site is served project-scoped at https://jnthns.github.io/loop/, which is
# why astro.config.mjs sets base: '/loop'. If internal links ever 404 in
# production but work in dev, that is the setting to look at.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install before the check: check.sh runs typecheck/test/build, all of
      # which need node_modules.
      - run: npm ci

      - name: scripts/check.sh
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          scripts/check.sh

      # check.sh already ran `astro build`, so dist/ exists by now. Assert it
      # rather than falling back to some other directory — a missing dist means
      # something is wrong, and deploying stale or empty output would hide it.
      - name: Verify build output
        run: |
          set -euo pipefail
          test -d dist || { echo "dist/ missing after build" >&2; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing" >&2; exit 1; }
          echo "dist/ contains $(find dist -name '*.html' | wc -l) page(s)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
