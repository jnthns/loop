name: verify

# External back-pressure: CI runs the SAME mechanical check the loop runs
# (scripts/check.sh). Green CI is the honest signal that keeps agents accountable
# — "tests pass" must mean a real green run, not a claim.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lint the harness scripts themselves.
      - name: shellcheck harness scripts
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      # check.sh detects package.json and runs typecheck/test/build, so the
      # toolchain has to exist before it runs. Without this the check exits 127
      # on `astro: not found` — which it silently did until 2026-07-29.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run the project's single source of truth for "is the work good?".
      - name: scripts/check.sh
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          scripts/check.sh
