name: news

# The only job in this repo that touches the network. It refreshes the committed
# news snapshot and commits it; that push triggers `pages.yml`, so a news refresh
# and a deploy are one pipeline. Builds and tests stay hermetic.

on:
  schedule:
    # Every six hours. Dynasty news does not move faster than a reader does.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch feeds
        run: npm run news:fetch

      - name: Commit only if the snapshot changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/news.json; then
            echo "No news changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Refresh news snapshot"
          git push
